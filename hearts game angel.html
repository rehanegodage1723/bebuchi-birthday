<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch my love, Angel ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #21002f, #7b155d, #ff6fa8);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-card {
      width: min(94vw, 520px);
      text-align: center;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 8vw, 46px);
    }

    .subtitle {
      margin: 0 0 14px;
      opacity: 0.9;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #game {
      position: relative;
      width: 100%;
      height: min(68vh, 620px);
      min-height: 430px;
      border: 2px solid rgba(255,255,255,0.55);
      border-radius: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.18), transparent 18%),
        radial-gradient(circle at 80% 35%, rgba(255,255,255,.12), transparent 20%),
        linear-gradient(180deg, rgba(20,0,35,.35), rgba(255,80,150,.2));
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      touch-action: none;
    }

    .heart {
      position: absolute;
      user-select: none;
      cursor: pointer;
      font-size: 42px;
      line-height: 1;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,.25));
      animation: wiggle .7s ease-in-out infinite alternate;
      z-index: 3;
    }

    @keyframes wiggle {
      from { transform: rotate(-8deg) scale(1); }
      to   { transform: rotate(8deg) scale(1.08); }
    }

    .burst {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      font-size: 26px;
      animation: burst .6s ease-out forwards;
    }

    @keyframes burst {
      0% { opacity: 1; transform: translate(0,0) scale(.7); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5); }
    }

    .message {
      min-height: 32px;
      margin: 12px 0;
      font-weight: bold;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 17px;
      font-weight: bold;
      color: #7b155d;
      background: white;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }

    button:active {
      transform: scale(.96);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 25px;
      text-align: center;
      background: rgba(25,0,40,.72);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .overlay h2 {
      font-size: 34px;
      margin: 0;
    }

    .overlay p {
      font-size: 18px;
      line-height: 1.5;
      margin: 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="game-card">
    <h1>Catch my love, Angel ❤️</h1>
    <p class="subtitle">Catch thehearts your Baby Boy Rehan is sending you! 🥺❤️</p>

    <div class="stats">
      <span>❤️ Score: <span id="score">0</span></span>
      <span>⏱️ Time: <span id="time">30</span></span>
    </div>

    <div id="game">
      <div id="overlay" class="overlay">
        <h2>Ready, Angel? 🥺❤️</h2>
        <p>Tap the falling hearts before they disappear!</p>
        <button id="startBtn">START GAME 💕</button>
      </div>
    </div>

    <div id="message" class="message">Your Baby Boy is cheering for you! ❤️</div>
  </div>

  <script>
    const game = document.getElementById("game");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const messageEl = document.getElementById("message");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");

    let score = 0;
    let timeLeft = 30;
    let playing = false;
    let spawnTimer;
    let countdownTimer;

    function startGame() {
      score = 0;
      timeLeft = 30;
      playing = true;

      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      messageEl.textContent = "Catch them! ❤️";

      overlay.classList.add("hidden");

      document.querySelectorAll(".heart, .burst").forEach(el => el.remove());

      spawnTimer = setInterval(spawnHeart, 650);

      countdownTimer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function spawnHeart() {
      if (!playing) return;

      const heart = document.createElement("div");
      heart.className = "heart";

      const hearts = ["❤️", "💗", "💖", "💕", "💘"];
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

      const maxX = game.clientWidth - 52;
      const startX = Math.max(5, Math.random() * maxX);

      heart.style.left = startX + "px";
      heart.style.top = "-55px";

      game.appendChild(heart);

      const speed = 2.0 + Math.random() * 2.2;
      let y = -55;
      let lastTime = performance.now();

      function fall(now) {
        if (!heart.isConnected || !playing) {
          if (heart.isConnected) heart.remove();
          return;
        }

        const delta = Math.min(now - lastTime, 40);
        lastTime = now;
        y += speed * (delta / 16.67);
        heart.style.top = y + "px";

        if (y > game.clientHeight + 20) {
          heart.remove();
          return;
        }

        requestAnimationFrame(fall);
      }

      heart.addEventListener("pointerdown", (event) => {
        event.preventDefault();

        if (!playing) return;

        score++;
        scoreEl.textContent = score;

        createBurst(
          parseFloat(heart.style.left) + 20,
          parseFloat(heart.style.top) + 20
        );

        heart.remove();

        if (score === 5) {
          messageEl.textContent = "You're doing amazing, Angel! 🥰";
        }

        if (score === 10) {
          messageEl.textContent = "Baby Boy is VERY proud of you! ❤️";
        }

        if (score === 20) {
          messageEl.textContent = "20 hearts! I love you 20 times more! 🥹❤️";
        }
      });

      requestAnimationFrame(fall);
    }

    function createBurst(x, y) {
      const burstChars = ["❤️", "✨", "💗", "💕"];

      for (let i = 0; i < 5; i++) {
        const burst = document.createElement("div");
        burst.className = "burst";
        burst.textContent =
          burstChars[Math.floor(Math.random() * burstChars.length)];

        burst.style.left = x + "px";
        burst.style.top = y + "px";

        burst.style.setProperty("--dx", (Math.random() * 100 - 50) + "px");
        burst.style.setProperty("--dy", (Math.random() * 100 - 70) + "px");

        game.appendChild(burst);

        setTimeout(() => burst.remove(), 650);
      }
    }

    function endGame() {
      playing = false;

      clearInterval(spawnTimer);
      clearInterval(countdownTimer);

      document.querySelectorAll(".heart").forEach(el => el.remove());

      let finalMessage;

      if (score < 5) {
        finalMessage = "Awww 🥺 You caught " + score + " hearts!";
      } else if (score < 15) {
        finalMessage = "Beautiful! You caught " + score + " hearts! ❤️";
      } else {
        finalMessage = "WOW! " + score + " hearts! You're amazing! 🥹❤️";
      }

      overlay.innerHTML = `
        <h2>Time's Up! 🎀</h2>
        <p>${finalMessage}</p>
        <p>But there's one heart you can never miss... ❤️</p>
        <button id="restartBtn">PLAY AGAIN 💕</button>
      `;

      overlay.classList.remove("hidden");

      document.getElementById("restartBtn").addEventListener("click", startGame);
    }

    startBtn.addEventListener("click", startGame);
  </script>

</body>
</html>
